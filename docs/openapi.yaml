  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks assigned to the caller, across all visible projects (cursor-paginated)
      description: >-
        Defaults to the caller as assignee. Visibility is bounded by project
        membership: admins see every project, everyone else only sees tasks
        in projects they belong to.
      parameters:
        - $ref: '#/components/parameters/AfterCursor'
        - $ref: '#/components/parameters/Limit'
        - { name: assignee_id, in: query, schema: { type: integer }, description: 'Filter by assignee; defaults to the caller. Any caller may set this — results remain bounded by the caller''s own project membership.' }
        - { name: agent_state, in: query, schema: { type: string, enum: [researching, awaiting_approval, implementing, review, blocked] } }
        - { name: updated_after, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedTasks' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Tasks]
      summary: Fetch a single task with tags + links + counts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Tasks]
      summary: Update mutable task fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: [string, 'null'] }
                column_id: { type: integer }
                assignee_id: { type: [integer, 'null'] }
                due_date: { type: [string, 'null'], example: '2026-06-15' }
                priority:
                  type: string
                  enum: [none, low, medium, high, urgent]
                sub_status: { type: [string, 'null'] }
                agent_state:
                  type: [string, 'null']
                  enum: [researching, awaiting_approval, implementing, review, blocked, null]
                  description: >-
                    Execution phase owned by the external agent bridge.
                    Setting it also stamps agent_state_at server-side
                    (not itself accepted or returned) with the current
                    time; clients cannot set that timestamp directly.
            example: { priority: high, assignee_id: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

