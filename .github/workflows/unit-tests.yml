name: Unit tests

# Runs the PHP unit suite against both database drivers (SQLite default
# and MySQL 8) per docs/DATABASE.md §9. The Playwright E2E suite stays
# SQLite-only — the UI doesn't care which dialect is underneath.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-sqlite:
    name: unit (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, dom, fileinfo, mbstring
          coverage: none
      - name: Run unit suite
        run: php tests/run.php

  unit-mysql:
    name: unit (mysql 8.0)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: otack_test
          MYSQL_USER: otack
          MYSQL_PASSWORD: otack
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      # Hands the same DSN to every test that opens via Connection::openFromEnv.
      # Tests that explicitly use sqlite::memory: keep working as-is — only
      # tests that read .env-driven config hit the MySQL service.
      DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=otack_test;charset=utf8mb4'
      DB_USER: 'otack'
      DB_PASSWORD: 'otack'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, dom, fileinfo, mbstring
          coverage: none
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u otack -potack --silent && break
            sleep 1
          done
      - name: Apply schema migrations against MySQL
        run: php bin/migrate.php
      - name: Run unit suite
        # The DSL + driver tests run against MySQL automatically because
        # they consult the bound driver. Tests that hard-code sqlite::memory:
        # still pass — they're testing the SQLite path on purpose.
        run: php tests/run.php

  api:
    name: api (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, dom, fileinfo, mbstring, curl
          coverage: none
      - name: Run API integration suite
        run: php tests/api/run.php

  e2e:
    name: e2e (playwright, sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, dom, fileinfo, mbstring, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install JS deps
        run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Run Playwright suite
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
